<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRATAMA LEGAL - Panel Admin</title>
<style>
:root{--navy:#0f2744;--gold:#c9a227;--bg:#f1f3f7;--bd:#dde3ea;--mut:#6b7785;--ok:#1f9d55}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#1d2733;font-size:14px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:8px 10px;position:sticky;top:0;z-index:20}
.hd{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:1px}.logo span{color:var(--gold)}
nav{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
nav button{background:#ffffff14;color:#fff;border:1px solid #ffffff33;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
nav button.on,nav button:hover{background:var(--gold);color:#111;border-color:var(--gold)}
main{max-width:1100px;margin:auto;padding:12px}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;text-decoration:none}
.btn.g{background:var(--gold);color:#111}.btn.wa{background:#1fa855}.btn.em{background:#c0392b}.btn.ln{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
h2{font-size:17px;color:var(--navy);margin:4px 0 10px}h3{font-size:14px;color:var(--navy);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.grid.w{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:var(--navy)}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid #c8d0db;border-radius:6px;font:inherit;margin:3px 0 8px;background:#fff}
textarea{min-height:90px}label{font-size:12px;font-weight:600;color:var(--navy)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.mut{color:var(--mut);font-size:12px}
.st{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11px;color:#fff;background:#888}
.st.Baru{background:#2980b9}.st.Diproses{background:#e67e22}.st.Selesai{background:#1f9d55}.st.Dibatalkan{background:#c0392b}.st.MenungguDokumen{background:#8e44ad}
.by{font-size:11.5px;color:#8a5a00;background:#fff6dc;border-radius:6px;padding:2px 8px;display:inline-block;margin:3px 0}.lg{border-bottom:1px dashed var(--bd);padding:4px 0;font-size:12px}.lg b{color:var(--navy)}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:50}
.login{max-width:340px;margin:50px auto}
.bar{height:10px;background:#e6ebf1;border-radius:6px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--gold)}@media print{header,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid}}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}
</style>
</head>
<body>
<header><div class="hd"><div class="logo">⚖ PRATAMA <span>LEGAL</span> · ADMIN</div><div id="who"></div></div><div class="hd"><nav id="nav"></nav></div></header>
<main id="app"></main>
<script>
const K='pratama_legal_v1';
const SEED="🏢|Pembuatan PT|Pendirian|2500000|7-10|Akta pendirian dari notaris;KTP & NPWP pendiri/direksi/komisaris;Alamat domisili usaha;Daftar KBLI yang dipilih;Modal dasar & modal disetor;Email & nomor HP aktif|🤝|Pembuatan CV|Pendirian|1500000|5-7|KTP & NPWP sekutu aktif/pasif;Nama CV (3 pilihan);Alamat usaha;Daftar KBLI;Modal awal|👤|PT Perorangan (UMK)|Pendirian|500000|2-3|KTP & NPWP pendiri;Alamat usaha;KBLI usaha;Modal usaha;Email aktif|🆔|Pembuatan NIB / OSS RBA|Perizinan Usaha|350000|1-3|KTP pemilik/direksi;NPWP;Akta & SK Kemenkumham;Alamat usaha;Daftar KBLI;Akun OSS (jika ada)|🔢|Penambahan / Perubahan KBLI|Perizinan Usaha|750000|2-5|Akta pendirian & perubahan terakhir;SK Kemenkumham;NIB & data akun OSS;KBLI lama & KBLI baru yang diinginkan;KTP direksi|📝|Akta Perubahan (Alamat/Direksi/Modal)|Notaris|2000000|5-7|Akta terakhir & SK Kemenkumham;KTP & NPWP pihak terkait;NIB;Data perubahan lengkap|🧾|NPWP Badan & PKP|Pajak|600000|3-5|Akta & SK;KTP & NPWP direksi;Alamat usaha;Surat domisili/sewa;NIB|📍|Surat Keterangan Domisili / SKDU|Domisili|450000|2-4|KTP pemilik;Akta;Bukti sewa/PBB/kepemilikan;Surat pengantar RT/RW|☪|Sertifikat Halal|Sertifikasi|1200000|7-14|NIB;Daftar produk & bahan;Alur proses produksi;Foto tempat produksi;KTP pemilik|🍱|PIRT / BPOM / Izin Edar|Sertifikasi|1500000|10-20|NIB;Daftar produk & komposisi;Foto produk & kemasan;Hasil uji lab (jika perlu);KTP pemilik|®|Pendaftaran Merek (HAKI)|HAKI|1800000|3-5 hari (+proses DJKI)|KTP pemilik;Nama & logo merek;Kelas barang/jasa;Surat UMK (jika ada);Contoh etiket|🏗|PBG / SLF Bangunan|Bangunan|0|Sesuai survei|KTP & NPWP pemilik;Sertifikat tanah;Gambar bangunan;Alamat lokasi;IMB lama (jika ada)|📑|Laporan LKPM & Kepatuhan OSS|Perizinan Usaha|400000|1-3|Akun OSS;NIB;Data realisasi investasi;Data tenaga kerja|🚚|Izin Khusus Sektor (Transport, Trading, dll)|Perizinan Usaha|0|Sesuai sektor|NIB;Akta & SK;KBLI sektor;Dokumen teknis sektor;Konsultasi untuk detail".split("|");
function seed(){const sv=[];for(let i=0;i<SEED.length;i+=6)sv.push({id:'S'+(sv.length+1),icon:SEED[i],name:SEED[i+1],cat:SEED[i+2],price:+SEED[i+3],days:SEED[i+4],req:SEED[i+5].split(';'),on:true});
return{wa1:'082297167223',wa2:'081929382015',email:'fiirizkytia@gmail.com',ann:'Melayani seluruh perizinan wilayah Jabodetabek. Konsultasi awal gratis lewat chat!',
tpl:'Halo Admin PRATAMA LEGAL, saya ingin konsultasi mengenai layanan perizinan. Mohon informasinya. Terima kasih.',
services:sv,orders:[],users:[],admins:{raffi:{pw:'raffi123',name:'Raffi'},adit:{pw:'adit123',name:'Adit'},bunda:{pw:'bunda123',name:'Bunda'},ayah:{pw:'ayah123',name:'Ayah'}},log:[],faq:[['Wilayah mana yang dilayani?','Jakarta, Bogor, Depok, Tangerang, Tangsel, dan Bekasi.'],['Berapa lama prosesnya?','Tergantung layanan, rata-rata 1-14 hari kerja setelah dokumen lengkap.'],['Bagaimana cara bayar?','Biaya dikonfirmasi admin via WhatsApp/Email sebelum proses dimulai.'],['Apakah dokumen saya aman?','Dokumen hanya dipakai untuk keperluan pengurusan izin Anda.']]}}
function defs(){return{hello:'Halo! 👋 Saya asisten balas cepat PRATAMA LEGAL. Pilih pertanyaan di bawah atau ketik pertanyaan Anda.',
testi:[{id:'T1',name:'Budi S.',role:'Pemilik Toko Online, Depok',stars:5,text:'NIB dan perubahan KBLI selesai cepat, admin responsif lewat WhatsApp. Sangat membantu!',on:true,by:'Bawaan',at:''},{id:'T2',name:'Sinta A.',role:'Founder Kafe, Jakarta Selatan',stars:5,text:'Pembuatan CV dibantu dari awal sampai selesai, dokumennya jelas dan tidak ribet.',on:true,by:'Bawaan',at:''},{id:'T3',name:'Pak Hendra',role:'Kontraktor, Bekasi',stars:4,text:'Proses PBG dijelaskan dengan detail dan status bisa dipantau.',on:true,by:'Bawaan',at:''}],
alur:[{t:'Pilih layanan',d:'Cari izin yang Anda butuhkan.'},{t:'Isi data',d:'Lengkapi form, teks pesan dibuat otomatis.'},{t:'Kirim ke admin',d:'Via WhatsApp atau email, lampirkan KTP, akta, data OSS.'},{t:'Proses & selesai',d:'Pantau status sampai dokumen jadi.'}],
quick:[{q:'Berapa biayanya?',k:'biaya,harga,tarif,berapa',a:'Biaya mulai dari Rp 350.000 tergantung jenis layanan. Lihat menu Layanan atau tanya admin untuk rincian.'},{q:'Berapa lama prosesnya?',k:'lama,waktu,hari,cepat',a:'Estimasi 1-14 hari kerja setelah dokumen lengkap, tergantung jenis izin.'},{q:'Dokumen apa yang disiapkan?',k:'dokumen,syarat,ktp,akta,npwp',a:'Umumnya KTP, NPWP, akta & SK Kemenkumham, data OSS, dan alamat usaha. Detail tiap layanan ada di menu Layanan.'},{q:'Wilayah mana saja?',k:'wilayah,jabodetabek,area,bogor,bekasi',a:'Kami melayani Jakarta, Bogor, Depok, Tangerang, Tangerang Selatan, dan Bekasi.'},{q:'Cara mengajukan?',k:'daftar,ajukan,order,pesan,cara',a:'Buka menu Ajukan, pilih layanan, isi data, lalu kirim teks pesan ke WhatsApp atau Email admin.'},{q:'Ubah / tambah KBLI',k:'kbli',a:'Untuk KBLI siapkan akta, SK Kemenkumham, NIB/akun OSS, dan KBLI yang diinginkan. Admin akan cek kesesuaiannya.'}],
fallback:'Terima kasih! Pertanyaan Anda akan dijawab langsung oleh admin. Silakan lanjutkan lewat WhatsApp atau Email di bawah.',
formcfg:{wilayah:['Jakarta Pusat','Jakarta Utara','Jakarta Barat','Jakarta Selatan','Jakarta Timur','Bogor','Depok','Tangerang','Tangerang Selatan','Bekasi'],opts:['Butuh bantuan cek KBLI yang sesuai','Butuh konsultasi dulu sebelum diproses','Urgent, ingin diproses secepatnya'],intro:'Isi data, lalu buat teks pesan siap kirim.',foot:'Setelah chat/email terbuka, lampirkan foto KTP, NPWP, Akta & data OSS.'},
mediacfg:{on:true,requireAll:true,maxMB:5,accept:'image/*,application/pdf',eta:'Prioritas: diproses lebih cepat',note:'Unggah foto/scan yang jelas dan terbaca. Lengkapi semua dokumen wajib agar langsung diproses.'},kontakTpl:['Halo, saya ingin konsultasi pembuatan PT/CV.','Halo, saya ingin menambah/mengubah KBLI.','Halo, saya ingin cek status pesanan saya.','Halo, saya ingin tanya biaya pengurusan izin.'],meta:{}}}
function norm(d){const D=defs();for(const k in D)if(d[k]==null)d[k]=D[k];if(!d.formcfg.opts)d.formcfg.opts=D.formcfg.opts;return d}
function load(){try{const d=JSON.parse(localStorage[K]);if(d&&d.services)return norm(d)}catch(e){}return norm(seed())}
function save(){try{localStorage[K]=JSON.stringify(db)}catch(e){}}
let db=load();save();
let me=sessionStorage.pl_admin||'',tab='dash',sel=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>n>0?'Rp '+Number(n).toLocaleString('id-ID'):'Hubungi';
const wanum=n=>{n=String(n).replace(/\D/g,'');return n.startsWith('0')?'62'+n.slice(1):n};
const walink=(n,t)=>'https://wa.me/'+wanum(n)+'?text='+encodeURIComponent(t);
const ST=['Baru','Diproses','Menunggu Dokumen','Selesai','Dibatalkan'];
const nm=()=>(db.admins[me]||{}).name||me;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function lg(a){db.log.unshift({by:me,name:nm(),a,at:new Date().toLocaleString('id-ID')});db.log=db.log.slice(0,300);save()}
const SECL={kontak:'Kontak WA/Email',layanan:'Layanan',pengumuman:'Pengumuman & Template',faq:'FAQ',testimoni:'Testimoni',alur:'Alur',form:'Form Ajukan',balas:'Balas Cepat',teks:'Teks Chat Kontak',media:'Layanan Media'};
function stamp(sec){db.meta=db.meta||{};db.meta[sec]={by:me,name:nm(),at:new Date().toLocaleString('id-ID')}}
function edBy(sec){const m=(db.meta||{})[sec];return `<div class="by">✏ Terakhir diedit oleh <b>${m?esc(m.name):'-'}</b>${m?' · '+esc(m.at):''}</div>`}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('pl_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fput(o){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await idb();return new Promise(res=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
async function fdel(id){const d=await idb();return new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=res;t.onerror=res})}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
function slots(s){return(s.media&&s.media.length)?s.media:s.req.map(n=>({n,req:true}))}
function setTab(t){tab=t;sel=null;render()}
function render(){
 db=load();
 if(!me||!db.admins[me]){$('#nav').innerHTML='';$('#who').innerHTML='';$('#app').innerHTML=`<div class="card login"><h2>🔐 Login Admin</h2><label>Username</label><input id="u" placeholder="raffi / adit / bunda / ayah"><label>Password</label><input id="p" type="password" onkeydown="if(event.key=='Enter')login()"><button class="btn g" onclick="login()">Masuk</button></div>`;return}
 const T=[['dash','📊 Dashboard'],['ord','📦 Pesanan'],['svc','📋 Layanan'],['cus','👥 Pelanggan'],['lap','📈 Laporan'],['med','🖼 Layanan Media'],['tes','⭐ Testimoni'],['alr','🧭 Alur'],['frm','✍ Form Ajukan'],['qr','⚡ Balas Cepat'],['set','⚙ Kontak & Setelan'],['tpl','💬 Template & Pengumuman'],['faq','❓ FAQ'],['log','🕘 Log Aktivitas'],['acc','🔑 Akun Admin'],['bk','💾 Backup']];
 $('#nav').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
 $('#who').innerHTML=`<span style="font-size:12px">👤 Login sebagai <b>${esc(nm())}</b></span> <button class="btn ln" style="padding:3px 8px" onclick="sessionStorage.pl_admin='';me='';render()">Keluar</button>`;
 const P={dash,ord,svc,cus,lap,med,tes,alr,frm,qr,set,tpl,faq,log,acc,bk};
 $('#app').innerHTML=((tab!=='dash')?'<div style="margin-bottom:8px"><button class="btn ln" onclick="'+(sel?'sel=null;render()':"setTab('dash')")+'">← Kembali</button></div>':'')+P[tab]();if(tab==='ord'&&sel&&sel!=='new')loadFiles(sel)}
function login(){db=load();const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;const a=db.admins[u];if(!a||a.pw!==p)return toast('Username/password salah');me=u;sessionStorage.pl_admin=u;lg('Login admin');render()}
function dash(){const o=db.orders,c=s=>o.filter(x=>x.status===s).length,omz=o.filter(x=>x.status==='Selesai').reduce((a,b)=>a+(+b.price||0),0);
return`<h2>Dashboard</h2><div class="grid"><div class="stat"><b>${o.length}</b>Total Pesanan</div><div class="stat"><b>${c('Baru')}</b>Baru</div><div class="stat"><b>${c('Diproses')}</b>Diproses</div><div class="stat"><b>${c('Menunggu Dokumen')}</b>Tunggu Dokumen</div><div class="stat"><b>${c('Selesai')}</b>Selesai</div><div class="stat"><b>${db.users.length}</b>Pelanggan</div><div class="stat"><b>${db.services.length}</b>Layanan</div><div class="stat"><b>${o.filter(x=>x.jalur==='media').length}</b>⚡ Via Media</div><div class="stat"><b style="font-size:14px">${rp(omz)}</b>Estimasi Selesai</div></div>
<div class="card"><h3>Pesanan Terbaru</h3>${o.slice(-5).reverse().map(x=>`<div class="lg"><b>${esc(x.id)}</b> ${esc(x.svc)} - ${esc(x.nama)} <span class="st ${x.status.replace(/ /g,'')}">${x.status}</span></div>`).join('')||'<span class="mut">Belum ada.</span>'}<div class="acts"><button class="btn" onclick="setTab('ord')">Kelola Pesanan</button></div></div>
<div class="card"><h3>Aktivitas Terakhir</h3>${db.log.slice(0,6).map(l=>`<div class="lg"><b>${esc(l.name)}</b> · ${esc(l.a)} <span class="mut">(${esc(l.at)})</span></div>`).join('')||'-'}</div>
<div class="card"><h3>✏ Siapa Mengedit Apa</h3>${Object.entries(SECL).map(([k,v])=>{const m=db.meta[k];return`<div class="lg">${v}: <b>${m?esc(m.name):'-'}</b> <span class="mut">${m?esc(m.at):''}</span></div>`}).join('')}</div><div class="card"><h3>Menu Cepat</h3><div class="acts"><button class="btn g" onclick="setTab('svc')">Tambah Layanan</button><button class="btn g" onclick="setTab('set')">Ganti WA/Email</button><button class="btn g" onclick="setTab('tpl')">Pengumuman</button><a class="btn wa" target="_blank" href="${walink(db.wa1,'Tes')}">Tes WA 1</a><a class="btn wa" target="_blank" href="${walink(db.wa2,'Tes')}">Tes WA 2</a><a class="btn em" href="mailto:${esc(db.email)}">Email</a></div></div>`}
let fs='Semua',fq='';
function ord(){if(sel)return ordDet();const l=db.orders.filter(o=>(fs==='Semua'||o.status===fs||(fs==='Jalur Media'&&o.jalur==='media')||(fs==='Jalur Biasa'&&o.jalur!=='media'))&&JSON.stringify(o).toLowerCase().includes(fq.toLowerCase())).slice().reverse();
return`<h2>Kelola Pesanan</h2><div class="row"><select onchange="fs=this.value;render()">${['Semua','Jalur Media','Jalur Biasa',...ST].map(s=>`<option ${s===fs?'selected':''}>${s}</option>`).join('')}</select><input placeholder="🔍 cari nama/ID/layanan" value="${esc(fq)}" onchange="fq=this.value;render()"></div>
${l.map(o=>`<div class="card"><b>${esc(o.id)}</b> · ${esc(o.svc)} <span class="st ${o.status.replace(/ /g,'')}">${o.status}</span>${o.jalur==='media'?' <span class="st" style="background:#b8860b">⚡ MEDIA</span>':''}<div class="mut">${esc(o.nama)} · ${esc(o.hp)} · ${esc(o.at)}</div><div class="acts"><button class="btn" onclick="sel='${o.id}';render()">Detail / Ubah</button></div></div>`).join('')||'<div class="card mut">Tidak ada pesanan.</div>'}`}
function ordDet(){const o=db.orders.find(x=>x.id===sel);if(!o){sel=null;return ord()}
const t=`Halo ${o.nama}, update pesanan ${o.id} (${o.svc}) di PRATAMA LEGAL: status *${o.status}*.${o.adminNote?' Catatan: '+o.adminNote:''} Terima kasih.`;
return`<h2>Pesanan ${esc(o.id)}</h2><div class="card"><p><b>${esc(o.svc)}</b> · ${rp(o.price)}<br>Pelanggan: ${esc(o.nama)} (${esc(o.user)})<br>HP: ${esc(o.hp)} · Email: ${esc(o.email||'-')}<br>Usaha: ${esc(o.usaha||'-')} · ${esc(o.kota||'-')}<br>KBLI: ${esc(o.kbli||'-')}<br>Catatan pelanggan: ${esc(o.note||'-')}<br>Masuk: ${esc(o.at)}<br>✏ Terakhir diubah oleh: <b>${esc(o.editBy||'-')}</b></p>
<label>Status</label><select id="os">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><label>Catatan untuk pelanggan</label><textarea id="on">${esc(o.adminNote||'')}</textarea>
<div class="acts"><button class="btn g" onclick="saveOrd('${o.id}')">💾 Simpan</button><a class="btn wa" target="_blank" href="${walink(o.hp,t)}">WA ke Pelanggan</a>${o.email?`<a class="btn em" href="mailto:${esc(o.email)}?subject=${encodeURIComponent('Update '+o.id)}&body=${encodeURIComponent(t)}">Email Pelanggan</a>`:''}<button class="btn ln" onclick="delOrd('${o.id}')">🗑 Hapus</button></div>
<div class="by" style="display:block;margin-top:8px">Jalur: <b>${o.jalur==='media'?'⚡ Media (prioritas, berkas diunggah)':'💬 Biasa (dokumen via WhatsApp)'}</b></div>${(o.chk&&o.chk.length)?`<h3 style="margin-top:10px">Checklist Pelanggan</h3>${o.chk.map(c=>`<div class="lg">${c.ok?'☑':'☐'} ${esc(c.n)}</div>`).join('')}`:''}${o.jalur==='media'?`<h3 style="margin-top:10px">Berkas Unggahan (${(o.docs||[]).length})</h3><div id="fl"><span class="mut">memuat…</span></div>`:''}<h3 style="margin-top:10px">Riwayat</h3>${(o.hist||[]).map(h=>`<div class="lg"><b>${esc(h.name)}</b> ${esc(h.a)} <span class="mut">${esc(h.at)}</span></div>`).join('')||'-'}</div>`}
function saveOrd(id){db=load();const o=db.orders.find(x=>x.id===id),s=$('#os').value,n=$('#on').value;(o.hist=o.hist||[]).push({name:nm(),a:`ubah status ${o.status}→${s}`,at:new Date().toLocaleString('id-ID')});o.status=s;o.adminNote=n;o.editBy=nm();lg(`Ubah pesanan ${id} → ${s}`);toast('Tersimpan oleh '+nm());render()}
function delOrd(id){if(!confirm('Hapus pesanan '+id+'?'))return;db=load();const oo=db.orders.find(x=>x.id===id);((oo&&oo.docs)||[]).forEach(d=>fdel(d.id));db.orders=db.orders.filter(x=>x.id!==id);lg('Hapus pesanan '+id);sel=null;render()}

let lp='Semua';
function ots(o){if(o.ts)return o.ts;const m=String(o.at||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():0}
function lapData(){const n=Date.now(),d=new Date(),st=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const lim={'Hari ini':st,'7 hari':n-6048e5,'30 hari':n-2592e6,'Bulan ini':new Date(d.getFullYear(),d.getMonth(),1).getTime()}[lp]||0;
return db.orders.filter(o=>ots(o)>=lim)}
function grp(a,f){const m={};a.forEach(x=>{const k=f(x)||'-';(m[k]=m[k]||[]).push(x)});return Object.entries(m).sort((p,q)=>q[1].length-p[1].length)}
function lapText(){const o=lapData(),sel=o.filter(x=>x.status==='Selesai'),bt=o.filter(x=>x.status==='Dibatalkan'),omz=sel.reduce((a,b)=>a+(+b.price||0),0);
return `*LAPORAN PRATAMA LEGAL*\nPeriode: ${lp}\nDibuat: ${new Date().toLocaleString('id-ID')} oleh ${nm()}\n\nTotal pesanan: ${o.length}\nSelesai: ${sel.length}\nDiproses/aktif: ${o.length-sel.length-bt.length}\nDibatalkan: ${bt.length}\nEstimasi nilai selesai: ${rp(omz)}\n\nLayanan terbanyak:\n`+grp(o,x=>x.svc).slice(0,5).map(([k,v],i)=>`${i+1}. ${k} (${v.length})`).join('\n')+`\n\nWilayah:\n`+grp(o,x=>x.kota).map(([k,v])=>`- ${k}: ${v.length}`).join('\n')}
function lap(){const o=lapData(),c=s=>o.filter(x=>x.status===s).length,sel=o.filter(x=>x.status==='Selesai'),omz=sel.reduce((a,b)=>a+(+b.price||0),0),pot=o.filter(x=>x.status!=='Dibatalkan').reduce((a,b)=>a+(+b.price||0),0),max=Math.max(1,...ST.map(c));
const bs=grp(o,x=>x.svc),bw=grp(o,x=>x.kota),bm=grp(o,x=>{const t=ots(x);return t?new Date(t).toLocaleDateString('id-ID',{month:'long',year:'numeric'}):'-'}),ba=grp(db.log,x=>x.name);
const t=lapText();
return`<h2>Laporan</h2><div class="card noprint"><label>Periode</label><select onchange="lp=this.value;render()">${['Semua','Hari ini','7 hari','30 hari','Bulan ini'].map(p=>`<option ${p===lp?'selected':''}>${p}</option>`).join('')}</select><div class="acts"><button class="btn g" onclick="window.print()">🖨 Cetak / Simpan PDF</button><button class="btn" onclick="csvL()">⬇ CSV Rinci</button><button class="btn ln" onclick="navigator.clipboard.writeText(lapText());toast('Laporan disalin')">📋 Salin Teks</button><a class="btn wa" target="_blank" href="${walink(db.wa1,t)}">Kirim ke WA 1</a><a class="btn wa" target="_blank" href="${walink(db.wa2,t)}">Kirim ke WA 2</a><a class="btn em" href="mailto:${esc(db.email)}?subject=${encodeURIComponent('Laporan PRATAMA LEGAL - '+lp)}&body=${encodeURIComponent(t)}">Kirim Email</a></div></div>
<div class="grid"><div class="stat"><b>${o.length}</b>Total Pesanan</div><div class="stat"><b>${sel.length}</b>Selesai</div><div class="stat"><b>${o.length?Math.round(sel.length/o.length*100):0}%</b>Tingkat Selesai</div><div class="stat"><b style="font-size:15px">${rp(omz)}</b>Nilai Selesai</div><div class="stat"><b style="font-size:15px">${rp(pot)}</b>Potensi (tanpa batal)</div><div class="stat"><b>${db.users.length}</b>Pelanggan</div><div class="stat"><b>${o.filter(x=>x.jalur==='media').length}</b>⚡ Via Media</div><div class="stat"><b>${o.filter(x=>x.jalur!=='media').length}</b>💬 Via Biasa</div></div>
<div class="card"><h3>Berdasarkan Status</h3>${ST.map(s=>`<div>${s}: <b>${c(s)}</b><div class="bar"><i style="width:${c(s)/max*100}%"></i></div></div>`).join('')}</div>
<div class="card"><h3>Berdasarkan Layanan</h3><div class="tw"><table><tr><th>Layanan</th><th>Jumlah</th><th>Selesai</th><th>Nilai Selesai</th></tr>${bs.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.length}</td><td>${v.filter(x=>x.status==='Selesai').length}</td><td>${rp(v.filter(x=>x.status==='Selesai').reduce((a,b)=>a+(+b.price||0),0))}</td></tr>`).join('')||'<tr><td colspan=4>Belum ada data</td></tr>'}</table></div></div>
<div class="grid w"><div class="card"><h3>Per Wilayah</h3>${bw.map(([k,v])=>`<div class="lg">${esc(k)}: <b>${v.length}</b></div>`).join('')||'-'}</div><div class="card"><h3>Per Bulan</h3>${bm.map(([k,v])=>`<div class="lg">${esc(k)}: <b>${v.length}</b></div>`).join('')||'-'}</div><div class="card"><h3>Aktivitas Admin (semua waktu)</h3>${ba.map(([k,v])=>`<div class="lg">${esc(k)}: <b>${v.length}</b> aksi</div>`).join('')||'-'}</div></div>
<div class="card"><h3>Daftar Pesanan Periode Ini</h3><div class="tw"><table><tr><th>ID</th><th>Tanggal</th><th>Pelanggan</th><th>Layanan</th><th>Status</th></tr>${o.slice().reverse().map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.at)}</td><td>${esc(x.nama)}</td><td>${esc(x.svc)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan=5>Tidak ada</td></tr>'}</table></div></div>`}
function csvL(){dl('laporan-'+lp.replace(/ /g,'-')+'.csv',['ID,Tanggal,Nama,HP,Layanan,Wilayah,Status,Nilai',...lapData().map(o=>[o.id,o.at,o.nama,o.hp,o.svc,o.kota,o.status,o.price].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv');lg('Ekspor laporan '+lp)}

async function loadFiles(id){const o=db.orders.find(x=>x.id===id),el=$('#fl');if(!o||!el)return;const ds=o.docs||[];if(!ds.length){el.innerHTML='<span class="mut">Belum ada berkas.</span>';return}
let h='';for(const d of ds){const r=await fget(d.id);if(!r){h+=`<div class="lg"><b>${esc(d.slot)}</b> — <span class="mut">file tidak ditemukan di browser ini</span></div>`;continue}const u=URL.createObjectURL(r.blob);h+=`<div class="lg"><b>${esc(d.slot)}</b> · ${esc(d.name)} <span class="mut">(${Math.ceil(d.size/1024)} KB)</span>${r.type.startsWith('image/')?`<div><a href="${u}" target="_blank"><img src="${u}" style="max-height:90px;border-radius:6px;margin:4px 0"></a></div>`:''}<div class="acts"><a class="btn" target="_blank" href="${u}">Lihat</a><a class="btn ln" download="${esc(d.name)}" href="${u}">Unduh</a><button class="btn em" onclick="delDoc('${id}','${d.id}')">Hapus</button></div></div>`}el.innerHTML=h}
async function delDoc(oid,fid){if(!confirm('Hapus berkas ini?'))return;db=load();const o=db.orders.find(x=>x.id===oid);await fdel(fid);o.docs=o.docs.filter(d=>d.id!==fid);(o.hist=o.hist||[]).push({name:nm(),a:'hapus berkas',at:new Date().toLocaleString('id-ID')});lg('Hapus berkas pesanan '+oid);render()}
function med(){const m=db.mediacfg;return`<h2>Layanan Media (Upload Berkas)</h2>${edBy('media')}<div class="card"><h3>Pengaturan Umum</h3><div class="row"><div><label>Jalur Media</label><select id="mo"><option value="1" ${m.on?'selected':''}>Aktif</option><option value="0" ${m.on?'':'selected'}>Nonaktif</option></select></div><div><label>Wajib lengkap sebelum kirim</label><select id="mr"><option value="1" ${m.requireAll?'selected':''}>Ya, wajib lengkap</option><option value="0" ${m.requireAll?'':'selected'}>Tidak</option></select></div><div><label>Batas ukuran per file (MB)</label><input id="mm" type="number" value="${m.maxMB}"></div><div><label>Jenis file</label><select id="ma">${[['image/*,application/pdf','Foto & PDF'],['image/*','Foto saja'],['application/pdf','PDF saja']].map(a=>`<option value="${a[0]}" ${m.accept===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div></div><label>Keunggulan / estimasi (tampil di pilihan jalur)</label><input id="me" value="${esc(m.eta)}"><label>Petunjuk untuk pelanggan</label><textarea id="mn">${esc(m.note)}</textarea><button class="btn g" onclick="saveMed()">💾 Simpan Pengaturan</button></div>
<h3>Dokumen Upload per Layanan</h3><div class="mut" style="margin-bottom:8px">Satu dokumen per baris. Tambahkan "(opsional)" di akhir baris jika tidak wajib. Daftar awal otomatis dari dokumen layanan.</div>
${db.services.map(s=>`<div class="card"><b>${s.icon} ${esc(s.name)}</b> <label class="mut" style="font-weight:400"><input type="checkbox" id="mon${s.id}" style="width:auto;margin:0 4px" ${s.mediaOn!==false?'checked':''}> Media aktif</label><textarea id="ms${s.id}" style="min-height:100px">${esc(((s.media&&s.media.length)?s.media:s.req.map(n=>({n,req:true}))).map(x=>x.n+(x.req?'':' (opsional)')).join('\n'))}</textarea><div class="by">✏ ${esc(s.mby||'-')} ${esc(s.mat||'')}</div><div class="acts"><button class="btn g" onclick="saveMS('${s.id}')">💾 Simpan</button><button class="btn ln" onclick="resetMS('${s.id}')">Reset otomatis</button></div></div>`).join('')}`}
function saveMed(){db=load();db.mediacfg={on:$('#mo').value==='1',requireAll:$('#mr').value==='1',maxMB:+$('#mm').value||5,accept:$('#ma').value,eta:$('#me').value,note:$('#mn').value};stamp('media');lg('Edit pengaturan Layanan Media');toast('Tersimpan oleh '+nm());render()}
function saveMS(id){db=load();const s=db.services.find(x=>x.id===id);s.media=$('#ms'+id).value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({n:x.replace(/\s*\(opsional\)\s*$/i,''),req:!/\(opsional\)\s*$/i.test(x)}));s.mediaOn=$('#mon'+id).checked;s.mby=nm();s.mat=new Date().toLocaleString('id-ID');stamp('media');lg('Edit dokumen media: '+s.name);toast('Tersimpan oleh '+nm());render()}
function resetMS(id){db=load();const s=db.services.find(x=>x.id===id);delete s.media;s.mby=nm();s.mat=new Date().toLocaleString('id-ID');stamp('media');lg('Reset dokumen media: '+s.name);render()}
function bk(){return`<h2>Backup &amp; Pulihkan</h2><div class="card"><div class="acts"><button class="btn g" onclick="exp()">⬇ Unduh Backup (JSON)</button><button class="btn ln" onclick="csv()">⬇ Ekspor Pesanan (CSV)</button></div><label style="margin-top:10px">Pulihkan dari teks JSON</label><textarea id="imp"></textarea><button class="btn" onclick="imp()">Pulihkan</button><button class="btn em" onclick="if(confirm('Reset semua data?')){db=seed();save();lg('Reset data');render()}">Reset Semua</button></div>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(){dl('pratama-legal-backup.json',JSON.stringify(db),'application/json');lg('Unduh backup')}
function csv(){dl('pesanan.csv',['ID,Nama,HP,Layanan,Status,Waktu',...db.orders.map(o=>[o.id,o.nama,o.hp,o.svc,o.status,o.at].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')}
function imp(){try{const d=JSON.parse($('#imp').value);if(!d.services)throw 0;db=d;save();lg('Pulihkan backup');toast('Berhasil');render()}catch(e){toast('JSON tidak valid')}}
render();
</script>
</body>
</html>
